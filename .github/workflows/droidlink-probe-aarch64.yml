name: DroidLink Probe aarch64 Alpine

on:
  push:
    branches:
      - droidlink-probe-aarch64
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aarch64-alpine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable aarch64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside Alpine 3.23 aarch64
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work \
            alpine:3.23 /bin/sh droidlink/ci-build.sh

      - name: Upload aarch64 Alpine artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidlink-probe-aarch64-alpine
          path: |
            dist/droidlink-probe-aarch64-alpine/
            dist/droidlink-probe-aarch64-alpine.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Commit built artifact back to branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            dist/droidlink-probe-aarch64-alpine \
            dist/droidlink-probe-aarch64-alpine.tar.gz \
            dist/droidlink-probe-aarch64-alpine.tar.gz.b64
          git commit -m "ci: publish DroidLink aarch64 Alpine probe" || exit 0
          git push origin HEAD:droidlink-probe-aarch64
