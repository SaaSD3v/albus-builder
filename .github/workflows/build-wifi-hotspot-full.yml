name: Build recovery (Albus Full Wi-Fi + Hotspot)

on:
  workflow_dispatch:
  push:
    branches:
      - recovery-wifi-clean
      - twrp-cli-minimal

permissions:
  contents: read

concurrency:
  group: albus-wifi-hotspot-full-${{ github.ref }}
  cancel-in-progress: true

env:
  ALBUS_RECOVERY_NETWORK_FLAGS: "1"
  ALBUS_RECOVERY_CLI_MINIMAL: "1"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            automake \
            bc \
            binutils-aarch64-linux-gnu \
            bison \
            build-essential \
            curl \
            file \
            flex \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            git \
            libelf-dev \
            libssl-dev \
            libtool \
            lzma \
            perl \
            pkg-config \
            python-is-python3 \
            qemu-user-static \
            unzip \
            xz-utils

      - name: Build full Wi-Fi + hotspot recovery
        run: bash scripts/build-wifi-clean.sh

      - name: Validate recovery kernel network flags
        run: |
          set -euo pipefail
          CFG=artifacts/kernel.config
          test -s "$CFG"
          grep -qx '# CONFIG_ANDROID_PARANOID_NETWORK is not set' "$CFG"

          for symbol in \
            SYSVIPC POSIX_MQUEUE NAMESPACES UTS_NS IPC_NS USER_NS PID_NS NET_NS \
            CGROUPS CGROUP_FREEZER CGROUP_DEVICE MEMCG CGROUP_SCHED FAIR_GROUP_SCHED \
            CPUSETS CGROUP_CPUACCT DEVTMPFS VETH OVERLAY_FS \
            BRIDGE BRIDGE_NETFILTER NETFILTER NETFILTER_ADVANCED NETFILTER_XTABLES \
            NF_CONNTRACK NF_CONNTRACK_IPV4 NF_NAT NF_NAT_IPV4 NF_NAT_MASQUERADE_IPV4 \
            NETFILTER_XT_NAT NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_MATCH_STATE \
            NETFILTER_XT_TARGET_TCPMSS \
            IP_NF_IPTABLES IP_NF_FILTER IP_NF_MANGLE IP_NF_NAT IP_NF_TARGET_MASQUERADE \
            IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES \
            IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET NETFILTER_XT_MATCH_RECENT
          do
            grep -qx "CONFIG_${symbol}=y" "$CFG" || {
              echo "Missing required kernel flag: CONFIG_${symbol}=y"
              exit 1
            }
          done

      - name: Validate CLI-minimal kernel profile
        run: |
          set -euo pipefail
          CFG=artifacts/kernel.config
          test -s "$CFG"

          for symbol in INPUT INPUT_EVDEV INPUT_UINPUT INPUT_KEYBOARD KEYBOARD_GPIO MSM_KGSL MSM_KGSL_IOMMU MSM_VIDC_V4L2; do
            grep -qx "CONFIG_${symbol}=y" "$CFG" || {
              echo "CLI-minimal unexpectedly lost CONFIG_${symbol}=y"
              exit 1
            }
          done

          for symbol in \
            FB FB_MSM FB_MSM_MDSS_COMMON FB_MSM_MDSS FB_MSM_MDSS_WRITEBACK \
            FB_MSM_MDSS_HDMI_PANEL MSM_DBA MSM_SDE_ROTATOR MOD_DISPLAY \
            SLIMPORT_ANX7805 SLIMPORT_COMMON SLIMPORT_MOD_DISPLAY PANEL_NOTIFICATIONS \
            USB3813 USB3813_DEBUG BACKLIGHT_LCD_SUPPORT \
            INPUT_MOUSEDEV INPUT_JOYSTICK INPUT_TABLET INPUT_TOUCHSCREEN \
            MSM_CAMERA MSMB_CAMERA MSM_CAMERA_SENSOR MSM_CPP MSM_CCI MSM_CSIPHY \
            MSM_CSID MSM_EEPROM MSM_ISPIF MSMB_JPEG MSM_FD
          do
            if grep -Eq "^CONFIG_${symbol}=(y|m)$" "$CFG"; then
              echo "CLI-minimal still enables CONFIG_${symbol}"
              exit 1
            fi
          done

          grep -qx 'kernel_profile=cli-minimal-display-touch-camera-off' artifacts/build-info.txt

      - name: Validate static legacy iptables payload
        run: |
          set -euo pipefail
          test -x recovery-wifi/out/iptables.albus
          file recovery-wifi/out/iptables.albus | tee iptables-file.txt
          grep -q 'ARM aarch64' iptables-file.txt
          grep -q 'statically linked' iptables-file.txt
          grep -q 'droidspaces_iptables=legacy-static-multicall-with-iptables-save-restore-aliases' artifacts/build-info.txt

          aarch64-linux-gnu-strings recovery-wifi/out/iptables.albus > iptables-strings.txt
          for token in iptables iptables-save iptables-restore DNAT MASQUERADE addrtype state; do
            grep -Fq "$token" iptables-strings.txt
          done

          QEMU="$(command -v qemu-aarch64-static)"
          SMOKE="$RUNNER_TEMP/albus-iptables-smoke"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE"
          cp recovery-wifi/out/iptables.albus "$SMOKE/iptables.albus"
          ln -s iptables.albus "$SMOKE/iptables"
          ln -s iptables.albus "$SMOKE/iptables-save"
          ln -s iptables.albus "$SMOKE/iptables-restore"

          "$QEMU" "$SMOKE/iptables" --version | tee iptables-version.txt
          grep -Eq '^iptables v1\.6\.2' iptables-version.txt
          "$QEMU" "$SMOKE/iptables-restore" --version | grep -Eq '^iptables-restore v1\.6\.2'
          "$QEMU" "$SMOKE/iptables" -m addrtype -h >/dev/null
          "$QEMU" "$SMOKE/iptables" -m state -h >/dev/null
          "$QEMU" "$SMOKE/iptables" -t nat -j DNAT -h >/dev/null
          "$QEMU" "$SMOKE/iptables" -t nat -j MASQUERADE -h >/dev/null

      - name: Validate hotspot payload
        run: |
          set -euo pipefail
          grep -qx 'CONFIG_UDHCPD=y' recovery-wifi/out/busybox.config
          for symbol in SHA256SUM CP MV CHOWN SYNC TIMEOUT DATE NTPD NSLOOKUP; do
            grep -qx "CONFIG_${symbol}=y" recovery-wifi/out/busybox.config
          done

          sh -n recovery-wifi/wifi
          sh -n recovery-wifi/wifi-udhcpc.script
          sh -n recovery-wifi/recovery-time-sync-albus
          sh -n recovery-wifi/rctools
          sh -n recovery-wifi/ds-recovery-check
          grep -Fq 'timeout 12 "$WPA"' recovery-wifi/wifi
          grep -Fq '[ -s "$STATE/lease.env" ]' recovery-wifi/wifi
          grep -Fq 'WPA_CLI_TIMEOUT=${WIFI_WPA_CLI_TIMEOUT:-2}' recovery-wifi/wifi
          grep -Fq 'CONTROL_TIMEOUT=${WIFI_CONTROL_TIMEOUT:-5}' recovery-wifi/wifi
          grep -Fq 'DATA_MOUNT_TIMEOUT=${WIFI_DATA_MOUNT_TIMEOUT:-8}' recovery-wifi/wifi
          grep -Fq 'MOUNT_TIMEOUT=${WIFI_MOUNT_TIMEOUT:-5}' recovery-wifi/wifi
          grep -Fq 'SYNC_TIMEOUT=${WIFI_SYNC_TIMEOUT:-5}' recovery-wifi/wifi
          grep -Fq 'stop_child_bounded "$dhcp_pid"' recovery-wifi/wifi
          grep -Fq 'stage=persistence checking saved wlan profiles' recovery-wifi/wifi
          grep -Fq 'stage=supplicant starting' recovery-wifi/wifi
          grep -Fq 'stage=association waiting up to 25s' recovery-wifi/wifi
          grep -Fq 'stage=dhcp acquiring lease' recovery-wifi/wifi
          grep -Fq 'Static resolver fallback:' recovery-wifi/wifi
          grep -Fq 'TIME_SYNC=/sbin/recovery-time-sync' recovery-wifi/wifi
          grep -Fq 'RCTOOLS=/sbin/rctools' recovery-wifi/wifi
          grep -Fq '"$RCTOOLS" mount data rw' recovery-wifi/wifi
          grep -Fq 'if [ "$#" -eq 0 ]; then' recovery-wifi/wifi
          if grep -Fq '"$WPACLI" -p' recovery-wifi/wifi; then
            echo "Direct unbounded wpa_cli invocation remains"
            exit 1
          fi
          if grep -Fq '"$IPTABLES" -' recovery-wifi/wifi; then
            echo "Direct unbounded iptables invocation remains"
            exit 1
          fi
          if grep -Fqi 'twrp mount' recovery-wifi/wifi; then
            echo "TWRP mount dependency remains in Wi-Fi runtime"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*service[[:space:]]+recovery([[:space:]]|$)' recovery-wifi/init.recovery.service.rc; then
            echo "TWRP recovery service must not exist in CLI-minimal overlay"
            exit 1
          fi
          grep -Fq 'The stock TWRP GUI/recovery service is intentionally not defined here.' recovery-wifi/init.recovery.service.rc
          grep -Fq 'RCTools - Motorola Albus CLI recovery' recovery-wifi/rctools
          grep -Fq 'rctools mount active system|vendor|oem|all [rw|ro]' recovery-wifi/rctools
          grep -Fq 'rctools mount data [rw|ro]' recovery-wifi/rctools
          grep -Fq 'rctools mount common [rw|ro]' recovery-wifi/rctools
          grep -Fq 'rctools droidspaces check' recovery-wifi/rctools
          grep -Fq 'TIMESYNC=/sbin/recovery-time-sync' recovery-wifi/rctools
          grep -Fq 'DSCHECK=/sbin/ds-recovery-check' recovery-wifi/rctools
          grep -q 'wifi_hotspot=ap-only-wlan0-plus-separate-ap0-vif-concurrency-and-repeater-modes' artifacts/build-info.txt
          grep -q 'wifi_repeater_bands=2.4GHz-and-5GHz-single-channel' artifacts/build-info.txt
          grep -q 'wifi_hotspot_nat=repeater-only-ap0-to-wlan0-masquerade-with-private-chains' artifacts/build-info.txt
          grep -q 'wifi_persistence_db=/data/local/wifi/.version' artifacts/build-info.txt
          grep -q 'wifi_wlan_persistence=/data/local/wifi/wlan/networks' artifacts/build-info.txt
          grep -q 'wifi_ap0_persistence=/data/local/wifi/ap0/hotspot.conf' artifacts/build-info.txt
          grep -q 'wifi_hotspot_persistence=data-local-wifi-ap0-v1' artifacts/build-info.txt
          grep -q 'wifi_control_watchdogs=wpa-cli-2s-iptables-5s-data-8s-mount-5s-sync-5s' artifacts/build-info.txt
          grep -q 'wifi_dns_fallback=busybox-nslookup-ipv4' artifacts/build-info.txt
          grep -q 'wifi_time_sync=one-shot-ntp-last-good-under-data-local-wifi' artifacts/build-info.txt
          grep -q 'recovery_frontend=rctools-channel-compatible' artifacts/build-info.txt
          grep -q 'recovery_mounts=rctools-direct-auto-ext4-f2fs-vfat-rw-default' artifacts/build-info.txt
          grep -q 'twrp_recovery_service=disabled-in-cli-minimal-overlay' artifacts/build-info.txt

          grep -Fq 'WIFI_WLAN_NETWORKS=$WIFI_WLAN_DIR/networks' recovery-wifi/wifi
          grep -Fq 'WIFI_AP_CONF=$WIFI_AP_DIR/hotspot.conf' recovery-wifi/wifi
          grep -Fq 'commit_validated_network()' recovery-wifi/wifi
          grep -Fq 'build_runtime_from_persistent()' recovery-wifi/wifi
          grep -Fq 'cmd_networks()' recovery-wifi/wifi
          grep -Fq 'cmd_forget()' recovery-wifi/wifi
          grep -Fq 'cmd_hotspot_create()' recovery-wifi/wifi
          grep -Fq 'cmd_hotspot_config()' recovery-wifi/wifi
          grep -Fq 'cmd_hotspot_start()' recovery-wifi/wifi
          grep -Fq 'start) cmd_hotspot_start "$@" ;;' recovery-wifi/wifi
          grep -Fq 'active) echo "mode: AP-only on wlan0"' recovery-wifi/wifi
          grep -qx 'IPTABLES=/sbin/iptables' recovery-wifi/wifi
          if grep -qx 'IPTABLES=/sbin/iptables.albus' recovery-wifi/wifi; then
            echo "Runtime must invoke xtables-multi through the /sbin/iptables alias"
            exit 1
          fi
          grep -Fq 'cmd_hotspot_repeater()' recovery-wifi/wifi
          grep -Fq 'cmd_hotspot_repeater_2g()' recovery-wifi/wifi
          grep -Fq 'cmd_hotspot_repeater_5g()' recovery-wifi/wifi
          grep -Fq 'repeater-2g:*) echo "mode: repeater 2.4 GHz (AP+STA+NAT)"' recovery-wifi/wifi
          grep -Fq 'repeater-5g:*) echo "mode: repeater 5 GHz (AP+STA+NAT)"' recovery-wifi/wifi
          grep -Fq 'STA_CHANNEL=$(( (STA_FREQ - 5000) / 5 ))' recovery-wifi/wifi
          grep -Fq "HOTSPOT_HW_MODE=a" recovery-wifi/wifi
          grep -Fq "HOTSPOT_HW_MODE=g" recovery-wifi/wifi
          grep -Fq 'Internet sharing/NAT is disabled in start-vif mode.' recovery-wifi/wifi
          grep -Fq 'ALBUS_HOTSPOT_FWD' recovery-wifi/wifi
          grep -Fq 'ALBUS_HOTSPOT_NAT' recovery-wifi/wifi
          grep -Fq 'MASQUERADE' recovery-wifi/wifi
          grep -Fq '/proc/sys/net/ipv4/ip_forward' recovery-wifi/wifi
          test -s artifacts/rctools
          test -s artifacts/ds-recovery-check
          test -s artifacts/init.recovery.service.rc
          test -s artifacts/recovery-time-sync-albus

          for bin in hostapd.albus iw.albus; do
            test -x "recovery-wifi/out/$bin"
            file "recovery-wifi/out/$bin" | tee "$bin-file.txt"
            grep -q 'ARM aarch64' "$bin-file.txt"
            grep -q 'statically linked' "$bin-file.txt"
          done

          aarch64-linux-gnu-strings recovery-wifi/out/hostapd.albus | grep -Fq 'nl80211'
          QEMU="$(command -v qemu-aarch64-static)"
          "$QEMU" recovery-wifi/out/hostapd.albus -v > hostapd-version.txt 2>&1 || true
          grep -Eq 'hostapd v2\.9' hostapd-version.txt
          "$QEMU" recovery-wifi/out/iw.albus --version > iw-version.txt 2>&1 || true
          grep -Eq 'iw version 5\.9' iw-version.txt

          "$QEMU" recovery-wifi/out/busybox.albus --list > busybox-applets.txt
          for applet in awk cat chmod chown cp date grep ifconfig ip mkdir mount mv nslookup ntpd ping \
                        readlink rm sed sha256sum sleep sync tail tee timeout udhcpc udhcpd; do
            grep -qx "$applet" busybox-applets.txt || {
              echo "BusyBox Albus binary is missing required applet: $applet"
              exit 1
            }
          done
          "$QEMU" recovery-wifi/out/busybox.albus timeout --help >/dev/null 2>&1 || true

      - name: Upload to GoFile
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          RESPONSE=$(curl -s -X POST "https://${SERVER}.gofile.io/contents/uploadfile" \
            -H "Authorization: Bearer ${{ secrets.GOFILE_TOKEN }}" \
            -F "file=@artifacts/recovery.img")
          echo "$RESPONSE" | jq .
          DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
          echo "GoFile link: $DOWNLOAD_PAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: recovery-albus-full-hotspot
          path: artifacts/*
          if-no-files-found: error
