name: Build Albus Recovery Console + DroidSpaces 4.9

on:
  workflow_dispatch:
  push:
    branches:
      - recovery-console-droidspaces-4.9
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'patches/4.9/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: recovery-console-droidspaces-49-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc \
            binutils \
            bison \
            build-essential \
            clang-14 \
            curl \
            file \
            flex \
            git \
            jq \
            libelf-dev \
            libssl-dev \
            lzma \
            python-is-python3 \
            unzip \
            xxd \
            xz-utils

      - name: Build recovery with Recovery Console and DroidSpaces 4.9
        run: |
          set -o pipefail
          bash scripts/build-recovery-console-recoverycfg.sh 2>&1 | tee build.log

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-console-droidspaces-4.9-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          if [ -z "$GOFILE_TOKEN" ]; then
            echo "GOFILE_TOKEN is not configured; skipping GoFile upload." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          RESPONSE=$(curl -s -X POST "https://${SERVER}.gofile.io/contents/uploadfile" \
            -H "Authorization: Bearer $GOFILE_TOKEN" \
            -F "file=@artifacts/recovery.img")
          echo "$RESPONSE" | jq .
          DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
          echo "GoFile link: $DOWNLOAD_PAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: albus-recovery-console-droidspaces-4.9
          path: artifacts/*
          if-no-files-found: error
